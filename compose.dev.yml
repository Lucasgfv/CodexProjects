services:
  migrate:
    build:
      context: .
      target: dependencies
    command: ["sh", "-c", "pnpm exec prisma generate && pnpm db:deploy"]
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules

  app:
    build:
      context: .
      target: dependencies
    command: ["sh", "-c", "rm -rf /app/.next/* && exec pnpm dev --hostname 0.0.0.0"]
    environment:
      WATCHPACK_POLLING: "true"
      CI: "true"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next

volumes:
  app_node_modules:
  app_next:
